name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a HACS/hassfest schema change is caught even without a push.
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Skip the brands check until this repo is submitted to and
          # accepted into home-assistant/brands - that's a separate PR
          # against another repository, not something this workflow can
          # satisfy on its own, and it would otherwise fail on every run.
          ignore: brands
