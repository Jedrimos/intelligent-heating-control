name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a HACS/hassfest schema change is caught even without a push.
    - cron: "0 5 * * 1"
  workflow_dispatch:
  workflow_call:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
