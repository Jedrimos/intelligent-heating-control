add_room:
  name: Zimmer hinzufügen
  description: Fügt ein neues Zimmer zur Heizungssteuerung hinzu.
  fields:
    name:
      name: Zimmername
      description: Name des Zimmers (z.B. "Wohnzimmer")
      required: true
      example: "Wohnzimmer"
      selector:
        text:
    temp_sensor:
      name: Temperatursensor
      description: Entitäts-ID des Temperatursensors im Zimmer
      required: false
      example: "sensor.wohnzimmer_temperatur"
      selector:
        entity:
          domain: sensor
    valve_entity:
      name: Thermostat/Ventil
      description: Entitäts-ID des steuerbaren Thermostats oder Ventils (optional)
      required: false
      selector:
        entity:
          domain: climate
    window_sensor:
      name: Fenstersensor
      description: Binärsensor für Fenster-offen-Erkennung (optional)
      required: false
      selector:
        entity:
          domain: binary_sensor
    room_offset:
      name: Zimmer-Offset (°C)
      description: Offset zur Heizkurven-Basistemperatur für dieses Zimmer
      required: false
      default: 0.0
      selector:
        number:
          min: -5
          max: 5
          step: 0.5
          unit_of_measurement: "°C"
    comfort_temp:
      name: Komfort-Temperatur (°C)
      required: false
      default: 21.0
      selector:
        number:
          min: 15
          max: 30
          step: 0.5
    eco_offset:
      name: Eco-Offset (°C)
      description: Abzug von der Komfort-Temperatur im Eco-Modus (z.B. 3 = 21°C - 3 = 18°C)
      required: false
      default: 3.0
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: "°C"
    sleep_offset:
      name: Schlaf-Offset (°C)
      description: Abzug von der Komfort-Temperatur im Schlaf-Modus (z.B. 4 = 21°C - 4 = 17°C)
      required: false
      default: 4.0
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: "°C"
    deadband:
      name: Totband (°C)
      description: Proportionalbereich für die Anforderungsberechnung
      required: false
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.1
    valve_entities:
      name: Thermostate/Ventile (Liste)
      required: false
      selector:
        object:
    window_sensors:
      name: Fenstersensoren (Liste)
      required: false
      selector:
        object:
    min_temp:
      name: Minimale Temperatur (°C)
      required: false
      default: 5.0
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
    max_temp:
      name: Maximale Temperatur (°C)
      required: false
      default: 30.0
      selector:
        number:
          min: 15
          max: 35
          step: 0.5
    absolute_min_temp:
      name: Absoluter Temperatur-Boden (°C)
      required: false
      default: 15.0
      selector:
        number:
          min: 5
          max: 20
          step: 0.5
    away_temp_room:
      name: Abwesend-Temperatur Zimmer (°C)
      required: false
      default: 16.0
      selector:
        number:
          min: 10
          max: 22
          step: 0.5
    away_offset:
      name: Abwesend-Abzug (°C)
      required: false
      default: 6.0
      selector:
        number:
          min: 0
          max: 15
          step: 0.5
    eco_max_temp:
      name: Eco-Maximum (°C)
      required: false
      default: 21.0
      selector:
        number:
          min: 10
          max: 28
          step: 0.5
    sleep_max_temp:
      name: Schlaf-Maximum (°C)
      required: false
      default: 19.0
      selector:
        number:
          min: 10
          max: 25
          step: 0.5
    away_max_temp:
      name: Abwesend-Maximum (°C)
      required: false
      default: 18.0
      selector:
        number:
          min: 5
          max: 22
          step: 0.5
    ha_schedule_off_mode:
      name: Zeitplan-Aus-Modus
      required: false
      default: "eco"
      selector:
        select:
          options:
            - "eco"
            - "sleep"
            - "away"
    room_qm:
      name: Zimmerfläche (m²)
      required: false
      selector:
        number:
          min: 0
          max: 200
          step: 0.5
    room_preheat_minutes:
      name: Zimmer-Vorheizzeit (min)
      description: "Minuten (-1 = globale Einstellung verwenden)"
      required: false
      default: -1
      selector:
        number:
          min: -1
          max: 120
          step: 1
    window_reaction_time:
      name: Fenster-Reaktionszeit (s)
      required: false
      default: 30
      selector:
        number:
          min: 0
          max: 300
          step: 10
    window_close_delay:
      name: Fenster-Schließverzögerung (s)
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 600
          step: 30
    window_open_temp:
      name: Temperatur bei offenem Fenster (°C)
      description: "Zieltemperatur wenn Fenster offen (0 = Frostschutztemperatur)"
      required: false
      selector:
        number:
          min: 0
          max: 18
          step: 0.5
    window_restore_mode:
      name: Sollwert nach Fenster schließen
      description: "schedule = Zeitplan neu berechnen, previous = letzten Wert vor Öffnung wiederherstellen"
      required: false
      default: "schedule"
      selector:
        select:
          options:
            - "schedule"
            - "previous"
    window_cascade_rooms:
      name: Fenster-Kaskade – Zielräume
      description: "Liste von Zimmer-IDs die abgesenkt werden wenn dieses Zimmer zu lange gelüftet wird"
      required: false
      selector:
        object:
    window_cascade_delay_minutes:
      name: Fenster-Kaskade – Verzögerung (min)
      required: false
      default: 30
      selector:
        number:
          min: 5
          max: 120
          step: 5
    window_cascade_offset:
      name: Fenster-Kaskade – Absenkung (°C)
      required: false
      default: 3.0
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.5
    schedules:
      name: IHC-Zeitpläne
      required: false
      selector:
        object:
    ha_schedules:
      name: HA-Zeitpläne
      required: false
      selector:
        object:
    humidity_sensor:
      name: Feuchtigkeitssensor
      required: false
      selector:
        entity:
          domain: sensor
    mold_protection_enabled:
      name: Schimmelschutz aktiviert
      required: false
      default: true
      selector:
        boolean:
    mold_humidity_threshold:
      name: Schimmelschutz-Feuchtigkeitsschwelle (%)
      required: false
      default: 70
      selector:
        number:
          min: 50
          max: 95
          step: 1
    co2_sensor:
      name: CO₂-Sensor
      required: false
      selector:
        entity:
          domain: sensor
    co2_threshold_good:
      name: CO₂-Schwelle gut (ppm)
      required: false
      default: 800
      selector:
        number:
          min: 400
          max: 1000
          step: 50
    co2_threshold_bad:
      name: CO₂-Schwelle schlecht (ppm)
      required: false
      default: 1200
      selector:
        number:
          min: 800
          max: 2000
          step: 50
    radiator_kw:
      name: Heizleistung Zimmer (kW)
      required: false
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
    hkv_sensor:
      name: HKV-Sensor
      required: false
      selector:
        entity:
          domain: sensor
    hkv_factor:
      name: HKV-Faktor (kWh/Einheit)
      required: false
      default: 0.083
      selector:
        number:
          min: 0.001
          max: 1.0
          step: 0.001
    room_presence_entities:
      name: Anwesenheits-Entitäten
      required: false
      selector:
        object:
    boost_default_duration:
      name: Boost-Dauer (min)
      required: false
      default: 60
      selector:
        number:
          min: 5
          max: 480
          step: 5
    boost_temp:
      name: Boost-Temperatur (°C)
      description: "Feste Zieltemperatur im Boost-Modus (0 = deaktiviert, nutzt Komfort-Temperatur)"
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
    trv_calibrations:
      name: TRV-Kalibrierungen (pro Gerät)
      description: "Dict mit entity_id → Offset °C, z.B. {\"climate.trv_schrank\": -2.0}"
      required: false
      selector:
        object:
    trv_temp_weight:
      name: TRV-Temperaturgewichtung (0–1)
      description: Anteil der TRV-Temperaturen im Blending (0 = nur Raumsensor)
      required: false
      default: 0.0
      selector:
        number:
          min: 0
          max: 1
          step: 0.1
    trv_temp_offset:
      name: TRV-Temperaturoffset (°C)
      description: Kalibrierungsoffset für TRV-Temperaturen
      required: false
      default: 0.0
      selector:
        number:
          min: -5
          max: 5
          step: 0.5
    trv_min_send_interval:
      name: TRV Min. Sendeinterval (s)
      required: false
      selector:
        number:
          min: 0
          max: 600
          step: 10
    presence_sensor:
      name: Zimmer-Anwesenheitssensor
      required: false
      selector:
        text:
    presence_sensor_on_delay:
      name: Anwesenheitssensor Einschaltverzögerung (s)
      required: false
      selector:
        number:
          min: 0
          max: 600
          step: 10
    presence_sensor_off_delay:
      name: Anwesenheitssensor Ausschaltverzögerung (s)
      required: false
      selector:
        number:
          min: 0
          max: 600
          step: 10
    room_temp_threshold:
      name: Heiz-Temperaturschwelle (°C)
      description: "Mindesttemperatur ab der geheizt wird (0 = deaktiviert)"
      required: false
      selector:
        number:
          min: 0
          max: 25
          step: 0.5
    comfort_temp_entity:
      name: Komfort-Temp-Entität
      description: input_number.* Entität für dynamischen Komfort-Sollwert
      required: false
      selector:
        text:
    eco_temp_entity:
      name: Eco-Temp-Entität
      description: input_number.* Entität für dynamischen Eco-Sollwert
      required: false
      selector:
        text:
    comfort_extend_entries:
      name: Komfort-Verlängerung (Liste)
      description: "Liste von {entity, state} Einträgen (OR-Logik). Ersetzt comfort_extend_entity."
      required: false
      selector:
        object:
    comfort_extend_entity:
      name: Komfort-Verlängerung Entität (Legacy)
      description: binary_sensor.* oder input_boolean.* Entität die Komfortmodus verlängert
      required: false
      selector:
        text:
    comfort_extend_state:
      name: Komfort-Verlängerung Zustand (Legacy)
      description: "Zustand der Entität der Verlängerung auslöst (Standard: on)"
      required: false
      selector:
        text:
    aggressive_mode_enabled:
      name: Aggressiver Modus aktiviert
      required: false
      selector:
        boolean:
    aggressive_mode_range:
      name: Aggressiver Modus Bereich (°C)
      required: false
      selector:
        number:
          min: 0.5
          max: 5
          step: 0.5
    aggressive_mode_offset:
      name: Aggressiver Modus Offset (°C)
      required: false
      selector:
        number:
          min: 0.5
          max: 5
          step: 0.5
    temp_calibration:
      name: Sensor-Kalibrierungsoffset (°C)
      required: false
      selector:
        number:
          min: -5
          max: 5
          step: 0.1

